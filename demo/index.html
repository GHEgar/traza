<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>traza · demo</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>traza</h1>
        <p>Street infographics from OpenStreetMap: poster, orientation, stats and names.</p>
    </header>
    <form id="controls">
        <label>Place <select name="place"></select></label>
        <label>Radius (m) <input name="radius" type="number" min="200" max="2500" step="100"></label>
        <label>Shape
            <select name="shape"><option value="circle">Circle</option><option value="rect">Rectangle</option></select>
        </label>
        <label>Theme <select name="theme"></select></label>
        <label>Color
            <select name="color"><option value="class">By road class</option><option value="names">By name</option></select>
        </label>
        <fieldset>
            <label><input type="checkbox" name="water" checked> Water</label>
            <label><input type="checkbox" name="parks" checked> Parks</label>
            <label><input type="checkbox" name="buildings"> Buildings</label>
        </fieldset>
        <label>Server
            <select name="endpoint">
                <option value="https://overpass-api.de/api/interpreter">overpass-api.de</option>
                <option value="https://overpass.private.coffee/api/interpreter">private.coffee</option>
                <option value="https://maps.mail.ru/osm/tools/overpass/api/interpreter">VK Maps</option>
            </select>
        </label>
        <button type="submit">Load</button>
        <output id="status"></output>
    </form>
    <main>
        <section class="poster">
            <div id="poster" class="frame"></div>
            <div class="actions">
                <button type="button" id="export-svg" disabled>Download SVG</button>
                <button type="button" id="export-png" disabled>Download PNG</button>
            </div>
        </section>
        <section class="side">
            <article>
                <h2>Orientation</h2>
                <div id="rose" class="frame"></div>
                <p id="order"></p>
            </article>
            <article>
                <h2>Network</h2>
                <dl id="stats"></dl>
            </article>
            <article>
                <h2>Names</h2>
                <ul id="categories" class="legend"></ul>
                <ol id="names"></ol>
            </article>
        </section>
    </main>
    <script type="module" src="./main.ts"></script>
</body>
</html>
